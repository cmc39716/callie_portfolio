  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
    }

    /* ONE CONTINUOUS PINTEREST BOARD */

    .photo-board {
      width: min(1500px, 94%);
      margin: 0 auto;
      padding: 55px 0 110px;
      columns: 3;
      column-gap: 20px;
    }

    .photo-board img {
      display: block;
      width: 100%;
      height: auto;
      margin: 0 0 20px;
      break-inside: avoid;
      cursor: zoom-in;
      transition: transform 0.3s ease;
    }

    .photo-board img:hover {
      transform: scale(1.025);
    }

    /* FULL SCREEN LIGHTBOX */

    .photo-lightbox {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.96);
      padding: 65px;
    }

    .photo-lightbox.active {
      display: flex;
    }

    .photo-lightbox img {
      max-width: 100%;
      max-height: 85vh;
      width: auto;
      height: auto;
      object-fit: contain;
    }

    .lightbox-close,
    .lightbox-prev,
    .lightbox-next {
      position: absolute;
      border: none;
      background: transparent;
      color: #fff;
      cursor: pointer;
      font-size: 32px;
      padding: 12px;
    }

    .lightbox-close {
      top: 15px;
      right: 25px;
      font-size: 42px;
    }

    .lightbox-prev {
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
    }

    .lightbox-next {
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
    }

    .lightbox-counter {
      position: absolute;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      font-size: 12px;
      letter-spacing: 0.12em;
    }

    @media (max-width: 900px) {
      .photo-board {
        columns: 2;
        column-gap: 15px;
      }

      .photo-board img {
        margin-bottom: 15px;
      }
    }

    @media (max-width: 600px) {
      .photo-board {
        columns: 1;
        padding: 30px 0 70px;
      }

      .photo-lightbox {
        padding: 60px 45px;
      }

      .lightbox-prev {
        left: 2px;
      }

      .lightbox-next {
        right: 2px;
      }
    }
  </style>

  <!-- FULL-SCREEN PHOTO VIEWER -->

  <div
    class="photo-lightbox"
    id="photoLightbox"
    role="dialog"
    aria-modal="true"
    aria-label="Photograph viewer"
    aria-hidden="true"
  >
    <button class="lightbox-close" id="lightboxClose"
            type="button" aria-label="Close">&times;</button>

    <button class="lightbox-prev" id="lightboxPrev"
            type="button" aria-label="Previous photo">&#8592;</button>

    <img id="lightboxImage" alt="">

    <button class="lightbox-next" id="lightboxNext"
            type="button" aria-label="Next photo">&#8594;</button>

  <script>
    const photos = Array.from(
      document.querySelectorAll("#photoBoard img")
    );

    const lightbox = document.getElementById("photoLightbox");
    const lightboxImage = document.getElementById("lightboxImage");
    const closeButton = document.getElementById("lightboxClose");
    const previousButton = document.getElementById("lightboxPrev");
    const nextButton = document.getElementById("lightboxNext");
    const counter = document.getElementById("lightboxCounter");

    let currentIndex = 0;
    let lastFocusedElement = null;

    function showPhoto(index) {
      currentIndex = (index + photos.length) % photos.length;

      const photo = photos[currentIndex];

      lightboxImage.src = photo.src;
      lightboxImage.alt = photo.alt;

      counter.textContent =
        (currentIndex + 1) + " / " + photos.length;
    }

    function openLightbox(index) {
      lastFocusedElement = document.activeElement;

      showPhoto(index);

      lightbox.classList.add("active");
      lightbox.setAttribute("aria-hidden", "false");

      document.body.style.overflow = "hidden";
      closeButton.focus();
    }

    function closeLightbox() {
      lightbox.classList.remove("active");
      lightbox.setAttribute("aria-hidden", "true");

      document.body.style.overflow = "";
      lightboxImage.removeAttribute("src");

      if (lastFocusedElement) {
        lastFocusedElement.focus();
      }
    }

    photos.forEach((photo, index) => {
      photo.tabIndex = 0;
      photo.setAttribute("role", "button");

      photo.addEventListener("click", () => {
        openLightbox(index);
      });

      photo.addEventListener("keydown", event => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          openLightbox(index);
        }
      });
    });

    closeButton.addEventListener("click", closeLightbox);

    previousButton.addEventListener("click", () => {
      showPhoto(currentIndex - 1);
    });

    nextButton.addEventListener("click", () => {
      showPhoto(currentIndex + 1);
    });

    lightbox.addEventListener("click", event => {
      if (event.target === lightbox) {
        closeLightbox();
      }
    });

    document.addEventListener("keydown", event => {
      if (!lightbox.classList.contains("active")) return;

      if (event.key === "Escape") {
        closeLightbox();
      }

      if (event.key === "ArrowLeft") {
        showPhoto(currentIndex - 1);
      }

      if (event.key === "ArrowRight") {
        showPhoto(currentIndex + 1);
      }

      if (event.key === "Tab") {
        const controls = [
          closeButton,
          previousButton,
          nextButton
        ];

        const focusedIndex =
          controls.indexOf(document.activeElement);

        if (event.shiftKey && focusedIndex <= 0) {
          event.preventDefault();
          controls[controls.length - 1].focus();
        } else if (
          !event.shiftKey &&
          focusedIndex === controls.length - 1
        ) {
          event.preventDefault();
          controls[0].focus();
        }
      }
    });

    /* DARK MODE */

    const themeToggle = document.getElementById("themeToggle");

    if (themeToggle) {
      themeToggle.addEventListener("click", () => {
        const isDark =
          document.body.classList.toggle("dark-mode");

        themeToggle.setAttribute(
          "aria-pressed",
          String(isDark)
        );
      });
    }

    /* MOBILE MENU */

    const menuToggle = document.getElementById("menuToggle");
    const navLinks = document.getElementById("navLinks");

    if (menuToggle && navLinks) {
      menuToggle.addEventListener("click", () => {
        const isOpen = navLinks.classList.toggle("active");

        menuToggle.setAttribute(
          "aria-expanded",
          String(isOpen)
        );

        menuToggle.setAttribute(
          "aria-label",
          isOpen ? "Close navigation" : "Open navigation"
        );
      });

      document.querySelectorAll(".nav-links a").forEach(link => {
        link.addEventListener("click", () => {
          navLinks.classList.remove("active");

          menuToggle.setAttribute("aria-expanded", "false");
          menuToggle.setAttribute(
            "aria-label",
            "Open navigation"
          );
        });
      });
    }
  </script>
